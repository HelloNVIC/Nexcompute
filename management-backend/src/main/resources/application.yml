server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: nexcompute-management
  # 环境配置统一由 docker-compose 的 environment: 注入（bootRun 则经 shell 环境变量 / application.yml 默认值）。
  # 不再读取根 .env（spring.config.import 已移除）；${ENV:默认} 无对应环境变量时回退默认值。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexcompute}
    username: ${DB_USERNAME:nexcompute}
    password: ${DB_PASSWORD:nexcompute}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 2048MB   # platform-env-ota-realtime D4：环境文件（Docker Desktop Installer.exe ~600MB+）
      max-request-size: 2048MB

# JWT 配置
nexcompute:
  management:
    version: ${MANAGEMENT_VERSION:0.0.1-SNAPSHOT}  # platform-env-ota-realtime：受控端"关于"展示的管理端版本
  # nas-allocation D4：NAS 分配模块配置（TrueNAS 连接 / AES 密钥 / 过期策略）
  # docker-compose environment: 注入 TRUENAS_* / PASSWORD_ENC_KEY / NAS_*；无注入时回退默认值（verifyTls=false 适配自签 http）
  nas:
    truenas:
      base-url: ${TRUENAS_BASE_URL:http://10.13.66.23}        # TrueNAS REST 基址（/api/v2.0）
      api-key: ${TRUENAS_API_KEY:}                              # API key（须 ACCOUNT_WRITE 角色）
      verify-tls: ${TRUENAS_VERIFY_TLS:false}                  # 自签证书关校验
      timeout-seconds: ${TRUENAS_TIMEOUT_SECONDS:30}            # 单请求超时
      retries: ${TRUENAS_RETRIES:2}                             # 连接错误重试次数
      user-home-parent: ${TRUENAS_USER_HOME_PARENT:}            # 新用户 home 父目录（空=仅 SMB，设置=开 SSH）
    password-enc-key: ${PASSWORD_ENC_KEY:}                     # AES-GCM 密钥（base64-urlsafe，16/24/32B）
    pending-expire-days: ${NAS_PENDING_EXPIRE_DAYS:7}           # PENDING 超期天数
    expiry-scan-interval-hours: ${NAS_EXPIRY_SCAN_INTERVAL_HOURS:6}  # PENDING 超期扫描间隔（小时）
    portal-base-url: ${NAS_PORTAL_BASE_URL:http://localhost:5173}    # 注册页基址回退（优先用当前请求 Origin/Referer，仅无请求上下文时用此）
  # newapi-user-allocation D4：NewAPI 用户分配模块配置（NewAPI 连接 / 过期策略）
  # docker-compose environment: 注入 NEWAPI_*；AES 密钥复用 nas.password-enc-key（PASSWORD_ENC_KEY，NAS/NewAPI 共用）
  # 无注入时回退默认值；NewAPI 为 http 无需 TLS 配置
  newapi:
    base-url: ${NEWAPI_BASE_URL:http://10.13.66.18:3001}            # NewAPI REST 基址（/api 前缀）
    access-token: ${NEWAPI_ACCESS_TOKEN:}                           # 系统访问令牌（Authorization: Bearer）；轮换后须更新并重启
    api-user: ${NEWAPI_API_USER:}                                   # 调用方用户 id（New-Api-User 头，须属管理员角色）
    timeout-seconds: ${NEWAPI_TIMEOUT_SECONDS:30}                   # 单请求超时
    retries: ${NEWAPI_RETRIES:2}                                    # 连接错误重试次数
    pending-expire-days: ${NEWAPI_PENDING_EXPIRE_DAYS:7}             # PENDING 超期天数
    expiry-scan-interval-hours: ${NEWAPI_EXPIRY_SCAN_INTERVAL_HOURS:6}  # PENDING 超期扫描间隔（小时）
    portal-base-url: ${NEWAPI_PORTAL_BASE_URL:http://localhost:5173}    # 注册页基址回退（优先用当前请求 Origin/Referer，仅无请求上下文时用此）
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1wbGVhc2UtY2hhbmdlLWl0}
    expiration-ms: 86400000  # 24h
    header: Authorization
    prefix: "Bearer "
  # 系统配置项（任务 1.7）
  monitoring:
    collect-interval-seconds: ${MONITORING_INTERVAL:5}      # 监控采集粒度，默认 5 秒
    retention-days: ${MONITORING_RETENTION_DAYS:30}          # 监控历史保留 30 日
    heartbeat-timeout-seconds: ${HEARTBEAT_TIMEOUT:3}        # platform-refinements #4：3 秒未收到心跳视为离线
    offline-scan-interval-ms: ${OFFLINE_SCAN_INTERVAL:2000}  # 离线检测扫描间隔（2 秒，匹配 3 秒阈值）
  agent:
    heartbeat-interval-seconds: ${HEARTBEAT_INTERVAL:5}      # 受控端心跳间隔
    ws-reconnect-base-ms: ${WS_RECONNECT_BASE:2000}          # WS 重连基础退避
    ws-reconnect-max-ms: ${WS_RECONNECT_MAX:60000}           # WS 重连最大退避
    file-transfer-chunk-size: ${FILE_CHUNK_SIZE:4194304}     # 文件分块 4MB
    # OTA 升级超时（platform-env-ota-realtime D7：可按 exe 体积调大）
    upgrade-command-timeout-ms: ${UPGRADE_COMMAND_TIMEOUT_MS:30000}    # 发命令等回包 300s
    upgrade-version-wait-timeout-ms: ${UPGRADE_VERSION_WAIT_TIMEOUT_MS:180000}  # 等重启回传新版本 180s（与 NexcomputeProperties 默认对齐，修 18s 误判失败）
  storage:
    root: ${STORAGE_ROOT:./data/storage}                    # 管理端文件存储根目录
    image-tar-dir: ${STORAGE_ROOT:./data/storage}/images    # 镜像 tar
    public-image-dir: ${STORAGE_ROOT:./data/storage}/public-images  # 公共镜像库
    migration-staging-dir: ${STORAGE_ROOT:./data/storage}/migration  # 迁移中转
  # email-notification D4：SMTP/品牌默认值（${ENV} 可覆盖；首启经 Flyway V28 种子入 system_config，运行时读 DB）
  email:
    from: ${EMAIL_FROM:cufel@cufe.edu.cn}                   # SMTP 发件人
    host: ${EMAIL_HOST:smtp.exmail.qq.com}                  # SMTP 服务器
    port: ${EMAIL_PORT:465}                                 # SMTP 端口
    protocol: ${EMAIL_PROTOCOL:smtps}                       # SMTP 协议（smtps/smtp）
    user: ${EMAIL_USER:cufel@cufe.edu.cn}                  # SMTP 认证用户名
    passwd: ${EMAIL_PASSWD:}                                 # SMTP 认证密码（明文，GET 脱敏，仅 PUT 接受明文）
    brand:
      name: ${EMAIL_BRAND_NAME:合算 Nexcompute}            # 邮件品牌名
      signature: |                                          # 邮件落款（多行）
        - Nexcompute 管理平台
        （此邮件由系统自动发送，请勿直接回复）
      logo-filename: ${EMAIL_LOGO_FILENAME:}                # Logo 文件名（空=classpath 默认 PNG）
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.nexcompute: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO
