<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" role="img" aria-label="Nexcompute 合算">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#0958d9"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0958d9"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <g id="chip">
      <rect x="-6" y="-6" width="12" height="12" rx="3.5" fill="#ffffff"/>
      <rect x="-2" y="-2" width="4" height="4" rx="1" fill="url(#grad)"/>
    </g>
  </defs>

  <!-- icon mark -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad)"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="19" y1="19" x2="19" y2="45"/>
    <line x1="45" y1="19" x2="45" y2="45"/>
    <line x1="19" y1="19" x2="45" y2="45"/>
  </g>
  <use href="#chip" x="19" y="19"/>
  <use href="#chip" x="45" y="19"/>
  <use href="#chip" x="19" y="45"/>
  <use href="#chip" x="45" y="45"/>

  <!-- wordmark -->
  <text x="78" y="38" font-family="Segoe UI, system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="28" font-weight="800" letter-spacing="0.5" fill="url(#text-grad)">Nexcompute</text>
  <text x="79" y="56" font-family="Segoe UI, system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="12" font-weight="600" fill="#8c8c8c">合算 · 分布式 GPU 算力管理平台</text>
</svg>
