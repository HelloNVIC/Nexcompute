# Nexcompute 管理端全栈 Docker Compose
# 包含：PostgreSQL + Redis + 后端（SpringBoot）+ 前端（Vue + nginx）
#
# 后端/前端镜像从私有仓库 10.13.66.18:5002/nexcompute 拉取，版本由 VERSION 环境变量控制：
#   VERSION=v1.0.0 docker compose up -d   # 拉取 nexcompute/backend:v1.0.0
# 未设置 VERSION 时回退到 :latest（build.ps1 每次构建都会同步刷新 :latest 标签）。

services:
  # ---- 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: nexcompute-postgres
    environment:
      POSTGRES_DB: nexcompute
      POSTGRES_USER: nexcompute
      POSTGRES_PASSWORD: nexcompute
    ports:
      - "5432:5432"
    volumes:
      - nexcompute-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcompute"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexcompute

  # ---- 缓存与消息队列 ----
  redis:
    image: redis:7-alpine
    container_name: nexcompute-redis
    ports:
      - "6379:6379"
    volumes:
      - nexcompute-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexcompute

  # ---- 管理端后端 ----
  backend:
    image: 10.13.66.18:5002/nexcompute/backend:${VERSION:-latest}
    container_name: nexcompute-backend
    # nas-allocation D4：根 .env 作单一真实源（TRUENAS_* / PASSWORD_ENC_KEY / NAS_*）
    # 与下方 environment: 并存，environment: 覆盖同名键（容器内 DB_URL 仍指向 postgres 服务）
    # required:false 保留无 .env 时的回退（仅 environment: 亦能起，NAS 模块降级）
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nexcompute
      DB_USERNAME: nexcompute
      DB_PASSWORD: nexcompute
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1wbGVhc2UtY2hhbmdlLWl0
      CORS_ORIGINS: http://localhost,http://localhost:5173
      STORAGE_ROOT: /app/data/storage
      MONITORING_INTERVAL: 5
      MONITORING_RETENTION_DAYS: 30
      HEARTBEAT_TIMEOUT: 3
    ports:
      - "8080:8080"
    volumes:
      - nexcompute-storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - nexcompute
    restart: unless-stopped

  # ---- 管理端前端 ----
  frontend:
    image: 10.13.66.18:5002/nexcompute/frontend:${VERSION:-latest}
    container_name: nexcompute-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nexcompute
    restart: unless-stopped

volumes:
  nexcompute-pgdata:
  nexcompute-redis-data:
  nexcompute-storage:

networks:
  nexcompute:
    driver: bridge
